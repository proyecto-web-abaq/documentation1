[project]
site_name = "ABAQ — Documentación"
site_url = "https://proyecto-web-abaq.github.io/documentation1/"
site_description = "Manuales de usuario de la Plataforma ABAQ y del Organizador ABAQ."
site_author = "Equipo de Desarrollo ABAQ"

copyright = "Copyright &copy; 2026 ABAQ"

repo_url = "https://github.com/proyecto-web-abaq/documentation1"
repo_name = "proyecto-web-abaq/documentation1"
edit_uri = "edit/dev/docs/"

nav = [
  { "Inicio" = "index.md" },
  { "Manuales de la plataforma" = [
    { "Índice" = "guias/index.md" },
    { "Usuario" = [
      { "Manual de usuario" = "guias/usuario/index.md" },
      { "Manual para Voluntario de Servicio Social" = "guias/usuario/manual-servicio-social.md" },
      { "Manual para Voluntario General" = "guias/usuario/manual-voluntario-general.md" }
    ]}
  ]},
  { "Organizador ABAQ" = [
    { "Manual del Colaborador" = "organizador-abaq/manual-colaborador.md" }
  ]}
]

[project.theme]
language = "es"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# logo = "assets/logo.png"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar preferencia del sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
